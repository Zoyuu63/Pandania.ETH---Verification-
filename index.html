<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoyu Shops~ | Verification Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        discord: {
                            bg: '#313338', card: '#2b2d31', hover: '#3f4147',
                            blurple: '#5865F2', blurpleHover: '#4752C4',
                            green: '#23a559', red: '#da373c', text: '#dbdee1', muted: '#949ba4'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #313338; 
            background-image: linear-gradient(rgba(17, 18, 20, 0.75), rgba(17, 18, 20, 0.75)), url('zoyubanner.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #dbdee1;
            font-family: 'Inter', sans-serif;
        }
        
        .glass-panel {
            background: rgba(43, 45, 49, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Z-index 50 memastikan Navbar selalu di depan -->
    <nav class="bg-[#1e1f22]/95 backdrop-blur-xl border-b border-[#2b2d31]/80 py-3 px-4 sm:px-6 shadow-xl z-50 sticky top-0 w-full">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-discord-blurple rounded-[12px] flex items-center justify-center text-white font-bold text-xl shadow-lg">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <h1 class="text-lg sm:text-xl font-bold text-white tracking-wide">Zoyu Shops~</h1>
            </div>
            
            <div class="flex gap-2">
                <button class="px-3 sm:px-4 py-2 rounded-md bg-discord-blurple/80 backdrop-blur-sm text-white font-medium border border-discord-blurple text-xs sm:text-sm shadow-md">
                    Verify
                </button>
            </div>
        </div>
    </nav>

    <!-- Z-index 10 agar panel verifikasi berada di bawah navbar saat di-scroll -->
    <main class="flex-grow flex items-start sm:items-center justify-center p-4 pt-8 pb-20 z-10 w-full relative">
        <div class="w-full max-w-md animate-slide-in my-4">
            <div class="glass-panel p-6 sm:p-8 rounded-2xl text-center">
                
                <!-- Bot Status -->
                <div class="mb-5 inline-flex items-center gap-2 bg-discord-green/10 px-3 py-1.5 rounded-full border border-discord-green/30 shadow-sm">
                    <div class="w-2.5 h-2.5 bg-discord-green rounded-full shadow-[0_0_8px_rgba(35,165,89,0.8)] animate-pulse"></div>
                    <span class="text-[10px] font-bold text-discord-green uppercase tracking-wide">System Online - Auto Verify</span>
                </div>

                <!-- Shield Icon -->
                <div class="w-20 h-20 bg-[#1e1f22]/80 rounded-full mx-auto mb-5 flex items-center justify-center border-4 border-[#2b2d31]/50 relative shadow-lg">
                    <i class="fa-solid fa-shield-halved text-3xl text-discord-green drop-shadow-[0_0_8px_rgba(35,165,89,0.5)]"></i>
                </div>
                
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-2 drop-shadow-md">Join Zoyu Shops~</h2>
                <p class="text-discord-text/80 mb-6 text-xs sm:text-sm drop-shadow-sm">To gain full access to the server, please complete the verification process below.</p>

                <!-- Status Message Box (Hidden by default) -->
                <div id="verify-status" class="hidden mb-6 p-4 rounded-lg bg-discord-card/80 border border-white/5 text-left backdrop-blur-md overflow-hidden shadow-lg">
                </div>

                <!-- Form -->
                <form id="verify-form" class="space-y-4 text-left">
                    <div>
                        <label class="block text-[10px] sm:text-xs font-bold text-discord-text/90 uppercase mb-2 drop-shadow-sm">Discord Username</label>
                        <div class="relative">
                            <i class="fa-brands fa-discord absolute left-3 top-3.5 text-discord-muted"></i>
                            <input type="text" id="input-username" required placeholder="e.g. zoyuoshikita" class="w-full bg-[#1e1f22]/80 text-white border border-white/5 rounded-md py-2.5 pl-10 pr-3 focus:ring-2 focus:ring-discord-blurple outline-none transition-all placeholder-discord-muted backdrop-blur-sm text-sm">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-verify" class="w-full bg-discord-blurple hover:bg-discord-blurpleHover text-white font-semibold py-3 rounded-md transition-all shadow-lg flex justify-center items-center gap-2 mt-4 text-sm">
                        <i class="fa-solid fa-paper-plane"></i> Verify Account
                    </button>
                </form>

                <!-- Staff Status Section -->
                <div class="mt-8 border-t border-white/10 pt-6 text-left">
                    <h3 class="text-[11px] font-bold text-discord-text/80 uppercase mb-4 tracking-wider drop-shadow-sm"><i class="fa-solid fa-users mr-1"></i> Staff Status</h3>
                    
                    <div class="space-y-2">
                        <!-- Zoyu (Owner) -->
                        <div class="flex items-center gap-3 bg-[#1e1f22]/60 p-2.5 rounded-lg border border-white/5 backdrop-blur-sm">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-discord-card border border-white/10 flex items-center justify-center text-white font-bold text-sm shadow-sm overflow-hidden">
                                    <img src="https://ui-avatars.com/api/?name=Zoyu&background=random&color=fff" alt="ZO" class="w-full h-full object-cover">
                                </div>
                                <div id="status-1374982961274818670" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-[#1e1f22] bg-gray-500 transition-colors duration-300"></div>
                            </div>
                            <div class="leading-tight">
                                <div class="text-sm font-semibold text-white flex items-center gap-1">Zoyu Forever <i class="fa-solid fa-crown text-yellow-500 text-[10px]"></i></div>
                                <div class="text-[11px] text-discord-muted">Owner</div>
                            </div>
                        </div>

                        <!-- Jouhan (Mod) -->
                        <div class="flex items-center gap-3 bg-[#1e1f22]/60 p-2.5 rounded-lg border border-white/5 backdrop-blur-sm">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-discord-card border border-white/10 flex items-center justify-center text-white font-bold text-sm shadow-sm overflow-hidden">
                                    <img src="https://ui-avatars.com/api/?name=Jouhan&background=random&color=fff" alt="JO" class="w-full h-full object-cover">
                                </div>
                                <div id="status-1333065941084409906" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-[#1e1f22] bg-gray-500 transition-colors duration-300"></div>
                            </div>
                            <div class="leading-tight">
                                <div class="text-sm font-semibold text-white flex items-center gap-1">Jouhan <i class="fa-solid fa-shield text-blue-400 text-[10px]"></i></div>
                                <div class="text-[11px] text-discord-muted">Moderator</div>
                            </div>
                        </div>

                        <!-- Mizo (Mod) -->
                        <div class="flex items-center gap-3 bg-[#1e1f22]/60 p-2.5 rounded-lg border border-white/5 backdrop-blur-sm">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-discord-card border border-white/10 flex items-center justify-center text-white font-bold text-sm shadow-sm overflow-hidden">
                                    <img src="https://ui-avatars.com/api/?name=Mizo&background=random&color=fff" alt="MI" class="w-full h-full object-cover">
                                </div>
                                <div id="status-1050353782866837564" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-[#1e1f22] bg-gray-500 transition-colors duration-300"></div>
                            </div>
                            <div class="leading-tight">
                                <div class="text-sm font-semibold text-white flex items-center gap-1">Mizo <i class="fa-solid fa-shield text-blue-400 text-[10px]"></i></div>
                                <div class="text-[11px] text-discord-muted">Moderator</div>
                            </div>
                        </div>

                        <!-- Fellix (Mod) -->
                        <div class="flex items-center gap-3 bg-[#1e1f22]/60 p-2.5 rounded-lg border border-white/5 backdrop-blur-sm">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-discord-card border border-white/10 flex items-center justify-center text-white font-bold text-sm shadow-sm overflow-hidden">
                                    <img src="https://ui-avatars.com/api/?name=Fellix&background=random&color=fff" alt="FE" class="w-full h-full object-cover">
                                </div>
                                <div id="status-1397731138524418150" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-[#1e1f22] bg-gray-500 transition-colors duration-300"></div>
                            </div>
                            <div class="leading-tight">
                                <div class="text-sm font-semibold text-white flex items-center gap-1">Fellix <i class="fa-solid fa-shield text-blue-400 text-[10px]"></i></div>
                                <div class="text-[11px] text-discord-muted">Moderator</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase bawaan kamu
        const firebaseConfig = {
            apiKey: "AIzaSyDomIAXu2J5j6ZA0Yl6qrhm96mwAKPOw20",
            authDomain: "dormz-member-access.firebaseapp.com",
            projectId: "dormz-member-access",
            storageBucket: "dormz-member-access.firebasestorage.app",
            messagingSenderId: "374656483125",
            appId: "1:374656483125:web:7cbfc0b461544abe1d967c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 1. SISTEM CCTV STAFF (REAL-TIME)
        // ==========================================
        const staffRef = collection(db, "staff_status");
        onSnapshot(staffRef, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                const userId = change.doc.id;
                const data = change.doc.data();
                const dot = document.getElementById(`status-${userId}`);
                
                if (dot) {
                    dot.classList.remove('bg-gray-500', 'bg-discord-green', 'bg-yellow-500', 'bg-discord-red');
                    
                    if (data.status === 'online') dot.classList.add('bg-discord-green');
                    else if (data.status === 'idle') dot.classList.add('bg-yellow-500');
                    else if (data.status === 'dnd') dot.classList.add('bg-discord-red');
                    else dot.classList.add('bg-gray-500'); // offline
                }
            });
        });

        // ==========================================
        // 2. SISTEM VERIFIKASI
        // ==========================================
        const form = document.getElementById('verify-form');
        const statusDiv = document.getElementById('verify-status');
        const btn = document.getElementById('btn-submit-verify');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('input-username').value.trim();
            if(!username) return;

            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            
            try {
                // Memasukkan antrean ke Firebase
                const docRef = await addDoc(collection(db, "verify_portal", "main_config", "requests"), {
                    discordUsername: username, status: 'pending', timestamp: Date.now()
                });

                form.classList.add('hidden');
                statusDiv.classList.remove('hidden');

                // Memantau jawaban dari bot di Termux
                const unsubscribe = onSnapshot(doc(db, "verify_portal", "main_config", "requests", docRef.id), (docSnap) => {
                    if (docSnap.exists()) {
                        const myRequest = docSnap.data();
                        
                        if (myRequest.status === 'pending') {
                            statusDiv.className = 'mb-6 p-4 rounded-lg bg-[#1e1f22]/80 backdrop-blur-md border border-yellow-500/30 text-left shadow-lg overflow-hidden';
                            statusDiv.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-robot text-yellow-500 text-2xl animate-bounce"></i>
                                    <div>
                                        <p class="text-white font-bold text-sm">Processing Verification...</p>
                                        <p class="text-[11px] text-discord-text/80 mt-1">Bot is checking <strong>${username}</strong> in the server.</p>
                                    </div>
                                </div>
                            `;
                        } else if (myRequest.status === 'approved') {
                            statusDiv.className = 'mb-6 p-4 rounded-lg bg-[#1e1f22]/80 backdrop-blur-md border border-discord-green/50 text-left shadow-lg overflow-hidden';
                            statusDiv.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-circle-check text-discord-green text-2xl"></i>
                                    <div>
                                        <p class="text-white font-bold text-sm">Verification Successful!</p>
                                        <p class="text-[11px] text-discord-text/80 mt-1">Role has been assigned. Welcome!</p>
                                    </div>
                                </div>
                            `;
                            unsubscribe();
                        } else if (myRequest.status === 'rejected') {
                            statusDiv.className = 'mb-6 p-4 rounded-lg bg-[#1e1f22]/80 backdrop-blur-md border border-discord-red/50 text-left shadow-lg overflow-hidden';
                            statusDiv.innerHTML = `
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-circle-xmark text-discord-red text-2xl"></i>
                                    <div>
                                        <p class="text-white font-bold text-sm">Verification Denied</p>
                                        <p class="text-[11px] text-discord-text/80 mt-1 text-red-300">${myRequest.reason || 'System error.'}</p>
                                    </div>
                                </div>
                                <button onclick="window.location.reload()" class="mt-3 text-xs bg-discord-hover/80 border border-white/10 px-3 py-1.5 rounded hover:bg-gray-600 transition text-white shadow-sm">Try Again</button>
                            `;
                            unsubscribe();
                        }
                    }
                });

            } catch (error) {
                btn.disabled = false; 
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Verify Account';
                alert("Connection error to server.");
            }
        });
    </script>
</body>
</html>
