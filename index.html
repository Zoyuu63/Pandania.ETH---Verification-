<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoyu Shops~ | Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f1115;
            background-image: linear-gradient(rgba(15, 17, 21, 0.8), rgba(15, 17, 21, 0.8)), url('zoyubanner.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: rgba(30, 33, 36, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 50; 
            backdrop-filter: blur(10px);
        }

        .glass-panel {
            background: rgba(43, 45, 49, 0.7);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 10;
        }

        .input-discord {
            background: #1e1f22;
            border: 1px solid #3f4147;
            color: #dbdee1;
            transition: all 0.2s;
        }

        .input-discord:focus {
            border-color: #5865F2;
            outline: none;
            box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.2);
        }

        .btn-discord {
            background-color: #5865F2;
            transition: background-color 0.2s;
        }

        .btn-discord:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="navbar p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-[#5865F2] w-8 h-8 rounded flex items-center justify-center shadow-md">
                <i class="fab fa-discord text-white"></i>
            </div>
            <h1 class="font-bold text-lg tracking-wide">Zoyu Shops~</h1>
        </div>
        <div class="flex items-center gap-4">
            <button class="btn-discord px-4 py-1.5 rounded text-sm font-medium shadow-md">Verify</button>
            <button onclick="toggleDashboard()" class="text-gray-400 hover:text-white transition cursor-pointer">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 py-10">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 md:p-8">
            
            <!-- Bot System Status -->
            <div class="flex justify-center mb-6">
                <div id="botStatusBadge" class="bg-gray-500/10 border border-gray-500/20 text-gray-400 px-4 py-1.5 rounded-full text-xs font-bold flex items-center tracking-wide transition-all duration-300">
                    <i class="fas fa-circle-notch fa-spin mr-2"></i> CONNECTING TO BOT...
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-[#1e1f22] rounded-full mx-auto flex items-center justify-center mb-4 border border-gray-700 shadow-lg">
                    <i class="fas fa-shield-alt text-2xl text-[#23a559]"></i>
                </div>
                <h2 class="text-2xl font-extrabold mb-2">Join Zoyu Shops~</h2>
                <p class="text-gray-400 text-sm px-2">To gain full access to the server, please complete the verification process below.</p>
            </div>

            <!-- Verification Form -->
            <form id="verifyForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wide mb-2 ml-1">Discord Username</label>
                    <div class="relative">
                        <i class="fas fa-at absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="text" id="username" required placeholder="e.g. zoyuoshikita" 
                               class="input-discord w-full py-3 pl-10 pr-4 rounded-lg text-sm">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-discord w-full py-3 rounded-lg font-bold shadow-lg flex justify-center items-center text-sm">
                    <i class="fas fa-paper-plane mr-2"></i> Verify Account
                </button>
            </form>

            <!-- Status Message Box -->
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg border"></div>

            <!-- Staff Status Section -->
            <div class="mt-10 pt-6 border-t border-gray-700/50">
                <h3 class="text-xs font-bold text-gray-400 mb-4 flex items-center tracking-widest uppercase">
                    <i class="fas fa-users mr-2"></i> Staff Status
                </h3>
                <div class="space-y-3">
                    <!-- Zoyu (Owner) -->
                    <div class="flex items-center bg-[#1e1f22] p-3 rounded-lg border border-gray-700/50">
                        <div class="relative">
                            <img src="https://ui-avatars.com/api/?name=Zoyu&background=random&color=fff" class="w-10 h-10 rounded-full">
                            <div id="status-1374982961274818670" class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 rounded-full border-2 border-[#1e1f22] transition-colors duration-300"></div>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-bold text-white flex items-center gap-1">Zoyu Forever <i class="fas fa-crown text-yellow-500 text-[10px]"></i></p>
                            <p class="text-[11px] text-gray-400 font-medium">Owner</p>
                        </div>
                    </div>
                    <!-- Jouhan (Mod) -->
                    <div class="flex items-center bg-[#1e1f22] p-3 rounded-lg border border-gray-700/50">
                        <div class="relative">
                            <img src="https://ui-avatars.com/api/?name=Jouhan&background=random&color=fff" class="w-10 h-10 rounded-full">
                            <div id="status-1333065941084409906" class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 rounded-full border-2 border-[#1e1f22] transition-colors duration-300"></div>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-bold text-white flex items-center gap-1">Jouhan <i class="fas fa-shield text-blue-400 text-[10px]"></i></p>
                            <p class="text-[11px] text-gray-400 font-medium">Moderator</p>
                        </div>
                    </div>
                    <!-- Mizo (Mod) -->
                    <div class="flex items-center bg-[#1e1f22] p-3 rounded-lg border border-gray-700/50">
                        <div class="relative">
                            <img src="https://ui-avatars.com/api/?name=Mizo&background=random&color=fff" class="w-10 h-10 rounded-full">
                            <div id="status-1050353782866837564" class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 rounded-full border-2 border-[#1e1f22] transition-colors duration-300"></div>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-bold text-white flex items-center gap-1">Mizo <i class="fas fa-shield text-blue-400 text-[10px]"></i></p>
                            <p class="text-[11px] text-gray-400 font-medium">Moderator</p>
                        </div>
                    </div>
                    <!-- Fellix (Mod) -->
                    <div class="flex items-center bg-[#1e1f22] p-3 rounded-lg border border-gray-700/50">
                        <div class="relative">
                            <img src="https://ui-avatars.com/api/?name=Fellix&background=random&color=fff" class="w-10 h-10 rounded-full">
                            <div id="status-1397731138524418150" class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 rounded-full border-2 border-[#1e1f22] transition-colors duration-300"></div>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm font-bold text-white flex items-center gap-1">Fellix <i class="fas fa-shield text-blue-400 text-[10px]"></i></p>
                            <p class="text-[11px] text-gray-400 font-medium">Moderator</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Admin Dashboard Modal -->
    <div id="adminDashboard" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-[#2b2d31] border border-[#1e1f22] rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-[#1e1f22] flex justify-between items-center bg-[#1e1f22] rounded-t-xl">
                <h2 class="text-lg font-bold text-white"><i class="fas fa-server mr-2 text-[#5865F2]"></i>System Logs & Dashboard</h2>
                <button onclick="toggleDashboard()" class="text-gray-400 hover:text-white bg-gray-700/30 w-8 h-8 rounded-full flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-grow space-y-2" id="logsContainer">
                <div class="text-center text-gray-500 text-sm py-10">Loading logs...</div>
            </div>
        </div>
    </div>

<script type="module">
  // KONFIGURASI FIREBASE ZOYU
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDomIAXu2J5j6ZA0Yl6qrhm96mwAKPOw20",
    authDomain: "dormz-member-access.firebaseapp.com",
    projectId: "dormz-member-access",
    storageBucket: "dormz-member-access.firebasestorage.app",
    messagingSenderId: "374656483125",
    appId: "1:374656483125:web:7cbfc0b461544abe1d967c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. PANTAU STATUS BOT (Online/Offline)
  const configRef = doc(db, "verify_portal", "main_config");
  onSnapshot(configRef, (docSnap) => {
      const data = docSnap.data();
      const badge = document.getElementById('botStatusBadge');
      if (data && data.botStatus === 'Online') {
          badge.className = 'bg-green-500/10 border border-green-500/20 text-[#23a559] px-4 py-1.5 rounded-full text-xs font-bold flex items-center tracking-wide';
          badge.innerHTML = '<span class="w-2 h-2 bg-[#23a559] rounded-full mr-2 animate-pulse shadow-[0_0_8px_#23a559]"></span> SYSTEM ONLINE - AUTO VERIFY';
      } else {
          badge.className = 'bg-red-500/10 border border-red-500/20 text-[#da373c] px-4 py-1.5 rounded-full text-xs font-bold flex items-center tracking-wide';
          badge.innerHTML = '<span class="w-2 h-2 bg-[#da373c] rounded-full mr-2"></span> SYSTEM OFFLINE - QUEUED';
      }
  });

  // 2. PANTAU STATUS CCTV STAFF (Real-time)
  const staffRef = collection(db, "staff_status");
  onSnapshot(staffRef, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
          const userId = change.doc.id;
          const status = change.doc.data().status;
          const dot = document.getElementById(`status-${userId}`);
          
          if (dot) {
              dot.classList.remove('bg-gray-500', 'bg-[#23a559]', 'bg-yellow-500', 'bg-[#da373c]');
              if (status === 'online') dot.classList.add('bg-[#23a559]');
              else if (status === 'idle') dot.classList.add('bg-yellow-500');
              else if (status === 'dnd') dot.classList.add('bg-[#da373c]');
              else dot.classList.add('bg-gray-500');
          }
      });
  });

  // 3. ADMIN DASHBOARD LOGS
  const requestsRef = collection(db, "verify_portal", "main_config", "requests");
  onSnapshot(requestsRef, (snapshot) => {
      const logs = [];
      snapshot.forEach(doc => logs.push({id: doc.id, ...doc.data()}));
      
      // Sort by newest first
      logs.sort((a, b) => b.timestamp - a.timestamp); 
      
      const container = document.getElementById('logsContainer');
      if(logs.length === 0) {
          container.innerHTML = '<div class="text-center text-gray-500 text-sm py-10">No requests found.</div>';
          return;
      }

      container.innerHTML = logs.map(log => {
          let statusHtml = '';
          if(log.status === 'pending') statusHtml = '<span class="bg-yellow-500/20 text-yellow-500 border border-yellow-500/30 text-[10px] font-bold px-2 py-1 rounded">PENDING</span>';
          else if(log.status === 'approved') statusHtml = '<span class="bg-green-500/20 text-[#23a559] border border-green-500/30 text-[10px] font-bold px-2 py-1 rounded">APPROVED</span>';
          else statusHtml = '<span class="bg-red-500/20 text-[#da373c] border border-red-500/30 text-[10px] font-bold px-2 py-1 rounded">REJECTED</span>';

          const timeString = log.timestamp ? new Date(log.timestamp).toLocaleString() : 'Unknown Time';

          return `
          <div class="bg-[#1e1f22] p-3 rounded-lg flex justify-between items-center border border-gray-700/50 hover:border-gray-600 transition">
              <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded bg-[#2b2d31] flex items-center justify-center text-gray-400">
                      <i class="fas fa-user text-xs"></i>
                  </div>
                  <div>
                      <p class="text-sm font-bold text-white">${log.discordUsername || 'Unknown'}</p>
                      <p class="text-[10px] text-gray-400">${timeString}</p>
                  </div>
              </div>
              <div class="flex flex-col items-end gap-1">
                  ${statusHtml}
                  ${log.reason ? `<span class="text-[9px] text-red-400">${log.reason}</span>` : ''}
              </div>
          </div>`;
      }).join('');
  });

  // 4. LOGIK FORM VERIFIKASI
  const form = document.getElementById('verifyForm');
  const btn = document.getElementById('submitBtn');
  const msgBox = document.getElementById('statusMessage');

  form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
      btn.disabled = true;
      msgBox.classList.add('hidden');

      try {
          const docRef = await addDoc(collection(db, "verify_portal", "main_config", "requests"), {
              discordUsername: username,
              status: 'pending',
              timestamp: Date.now()
          });

          // Pantau perubahan status khusus untuk request ini
          const unsubscribe = onSnapshot(docRef, (docSnap) => {
              const data = docSnap.data();
              if (data.status !== 'pending') {
                  unsubscribe();
                  msgBox.classList.remove('hidden');
                  msgBox.className = 'mt-6 p-4 rounded-lg border text-sm shadow-lg';
                  
                  if (data.status === 'approved') {
                      msgBox.classList.add('bg-green-500/10', 'border-green-500/30');
                      msgBox.innerHTML = `
                          <div class="flex items-center text-[#23a559] mb-1">
                              <i class="fas fa-check-circle mr-2 text-lg"></i>
                              <h4 class="font-bold">Verification Successful!</h4>
                          </div>
                          <p class="text-xs text-gray-300 ml-6 mt-1">Role has been assigned. Welcome to the server!</p>
                      `;
                      document.getElementById('username').value = '';
                  } else {
                      msgBox.classList.add('bg-red-500/10', 'border-red-500/30');
                      msgBox.innerHTML = `
                          <div class="flex items-center text-[#da373c] mb-1">
                              <i class="fas fa-times-circle mr-2 text-lg"></i>
                              <h4 class="font-bold">Verification Denied</h4>
                          </div>
                          <p class="text-xs text-gray-300 ml-6 mt-1">Reason: ${data.reason || 'User not found in server.'}</p>
                          <button type="button" onclick="document.getElementById('statusMessage').classList.add('hidden')" class="mt-3 ml-6 px-3 py-1.5 bg-[#2b2d31] rounded text-xs font-medium hover:bg-[#383a40] transition border border-gray-600">Try Again</button>
                      `;
                  }
                  btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Verify Account';
                  btn.disabled = false;
              }
          });
      } catch (error) {
          msgBox.classList.remove('hidden');
          msgBox.className = 'mt-6 p-4 rounded-lg border bg-red-500/10 border-red-500/30 text-red-400 text-sm';
          msgBox.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> Connection error to server. Please try again.';
          btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Verify Account';
          btn.disabled = false;
      }
  });

  // Global function for dashboard toggle
  window.toggleDashboard = function() {
      const modal = document.getElementById('adminDashboard');
      modal.classList.toggle('hidden');
  }
</script>
</body>
</html>
